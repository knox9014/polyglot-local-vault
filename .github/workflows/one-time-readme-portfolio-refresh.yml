name: One-time README portfolio refresh

on:
  push:
    branches:
      - chore/readme-portfolio-refresh

permissions:
  contents: write

jobs:
  refresh-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/readme-portfolio-refresh

      - name: Replace README hero sections
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "README.md": '''[한국어](README.ko.md) | **English**

# Polyglot Local Vault

**Fast local-first file search and knowledge vault.**

Search files, symbols, headings, config keys, and relationships across your local workspace — entirely on your machine. Polyglot uses deterministic indexing and structure extraction; AI is optional through MCP.

[![Rust](https://img.shields.io/badge/Rust-000000?logo=rust&logoColor=white)](https://www.rust-lang.org/)
[![Tauri](https://img.shields.io/badge/Tauri-24C8DB?logo=tauri&logoColor=white)](https://tauri.app/)
[![Local First](https://img.shields.io/badge/local--first-green)](https://github.com/knox9014/polyglot-local-vault)
[![MCP](https://img.shields.io/badge/MCP-model--context--protocol-lightgrey)](https://modelcontextprotocol.io/)
[![License](https://img.shields.io/badge/license-PolyForm%20Noncommercial-lightgrey)](LICENSE)

**[Website](https://knox9014.github.io/polyglot-local-vault/)** · **[Download v0.1.0](https://github.com/knox9014/polyglot-local-vault/releases/tag/v0.1.0)** · **[MCP binary](https://github.com/knox9014/polyglot-local-vault/releases/download/v0.1.0/vault-mcp-windows-x64.exe)**

![Polyglot relationship graph showing files and their connections](docs/screenshots/graph-view.png)

## Why Polyglot?

- **Search beyond filenames.** Functions, methods, headings, config keys, and other structures get stable `vault://` addresses and can be searched directly.
- **Local and deterministic by default.** Indexing, search, structure extraction, and relationship inference run locally without requiring an account, cloud service, or AI model.
- **Built for both humans and tools.** Use the desktop workspace directly, or expose the same Vault through MCP with `search`, `read`, `neighbors`, and `link`.

## Measured, not guessed

| Metric | Result |
|---|---:|
| Filename fuzzy search | **7.4 ms p95 @ 100K files** |
| Cold indexing | **18.5 s @ 100K files** |
| Supported formats | **12** |
| File link auto-recovery | **95.7%** |
| Symbol survival while editing | **96.9% with Tree-sitter** |
| MCP evaluation | **20/20 correct · 1.05 calls/query** |
| MCP token use vs grep | **17.6× fewer tokens** |

> Measurements come from 18 real public repositories covering roughly 230K files and 130K commits. Methodology and limits are documented in [`docs/design/17_MEASUREMENT_BASIS.md`](docs/design/17_MEASUREMENT_BASIS.md).

**Current status:** P0–P4 complete, including deterministic indexing/search, 12-format symbol extraction, relationship graph and suggestions, and MCP integration.

''',
              "README.ko.md": '''**한국어** | [English](README.md)

# Polyglot Local Vault

**빠른 로컬 우선 파일 검색·지식 Vault.**

내 컴퓨터의 파일뿐 아니라 함수, 심볼, 제목, 설정 키와 파일 간 관계까지 한 번에 검색하고 탐색하는 로컬 데스크톱 도구입니다. 인덱싱과 구조 추출은 결정론적 알고리즘으로 처리하며, AI는 MCP를 통해 선택적으로 연결합니다.

[![Rust](https://img.shields.io/badge/Rust-000000?logo=rust&logoColor=white)](https://www.rust-lang.org/)
[![Tauri](https://img.shields.io/badge/Tauri-24C8DB?logo=tauri&logoColor=white)](https://tauri.app/)
[![Local First](https://img.shields.io/badge/local--first-green)](https://github.com/knox9014/polyglot-local-vault)
[![MCP](https://img.shields.io/badge/MCP-model--context--protocol-lightgrey)](https://modelcontextprotocol.io/)
[![License](https://img.shields.io/badge/license-PolyForm%20Noncommercial-lightgrey)](LICENSE)

**[소개 페이지](https://knox9014.github.io/polyglot-local-vault/)** · **[v0.1.0 다운로드](https://github.com/knox9014/polyglot-local-vault/releases/tag/v0.1.0)** · **[MCP 바이너리](https://github.com/knox9014/polyglot-local-vault/releases/download/v0.1.0/vault-mcp-windows-x64.exe)**

![파일과 관계를 보여주는 Polyglot 그래프](docs/screenshots/graph-view.png)

## 왜 Polyglot인가?

- **파일명보다 더 깊게 검색합니다.** 함수, 메서드, 제목, 설정 키 같은 내부 구조에도 안정적인 `vault://` 주소를 부여하고 직접 검색할 수 있습니다.
- **기본이 로컬·결정론적입니다.** 계정, 클라우드 서비스, AI 모델 없이도 인덱싱·검색·구조 추출·관계 추론이 로컬에서 동작합니다.
- **사람과 도구가 같은 Vault를 사용합니다.** 데스크톱 앱으로 직접 쓰거나 MCP의 `search`, `read`, `neighbors`, `link`로 외부 도구에 연결할 수 있습니다.

## 추측이 아닌 실측

| 지표 | 결과 |
|---|---:|
| 파일명 퍼지 검색 | **7.4 ms p95 @ 100K 파일** |
| Cold 인덱싱 | **18.5 s @ 100K 파일** |
| 지원 형식 | **12종** |
| 파일 링크 자동 복구율 | **95.7%** |
| 편집 중 심볼 보존율 | **Tree-sitter 96.9%** |
| MCP 평가 | **20/20 정답 · 질의당 평균 1.05회 호출** |
| grep 대비 MCP 토큰 사용량 | **17.6배 절감** |

> 수치는 실제 공개 저장소 18개, 약 23만 파일과 13만 커밋을 대상으로 측정했습니다. 측정 방법과 한계는 [`docs/design/17_MEASUREMENT_BASIS.md`](docs/design/17_MEASUREMENT_BASIS.md)에 기록되어 있습니다.

**현재 상태:** 결정론적 인덱싱·검색, 12개 형식 심볼 추출, 관계 그래프·제안 시스템, MCP 연동까지 P0–P4 완료.

'''
          }

          markers = {
              "README.md": "## Progress\n",
              "README.ko.md": "## 진행 상황\n",
          }

          for filename, prefix in replacements.items():
              path = Path(filename)
              original = path.read_text(encoding="utf-8")
              marker = markers[filename]
              if marker not in original:
                  raise SystemExit(f"marker not found in {filename}: {marker!r}")
              tail = original[original.index(marker):]
              path.write_text(prefix + tail, encoding="utf-8")

      - name: Verify README structure and links
        shell: python
        run: |
          from pathlib import Path
          for filename in ("README.md", "README.ko.md"):
              text = Path(filename).read_text(encoding="utf-8")
              assert "blob/main/LICENSE" not in text
              assert "](LICENSE)" in text
              assert "docs/screenshots/graph-view.png" in text
              assert "7.4 ms p95" in text
              assert "17.6" in text
              assert text.count("## Progress") == (1 if filename == "README.md" else 0)
              assert text.count("## 진행 상황") == (1 if filename == "README.ko.md" else 0)

      - name: Commit refreshed READMEs and remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-readme-portfolio-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ko.md .github/workflows/one-time-readme-portfolio-refresh.yml
          git commit -m "Refresh README first impression"
          git push origin chore/readme-portfolio-refresh
