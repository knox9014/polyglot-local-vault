<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폴리곤</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/launcher.js" defer></script>
  </head>
  <body class="launcher-body">
    <div id="launcher">
      <aside id="launcher-vaults">
        <div id="launcher-vault-list"></div>
      </aside>

      <section id="launcher-main">
        <div id="launcher-brand">
          <div id="launcher-logo">◈</div>
          <h1>폴리곤</h1>
          <p class="version">버전 0.1.0</p>
        </div>

        <div id="launcher-actions">
          <div class="launcher-action">
            <div>
              <div class="action-title">Vault 폴더 열기</div>
              <div class="action-desc">검색·연결할 파일들이 있는 폴더를 선택합니다.</div>
            </div>
            <button id="launcher-open-btn" class="primary">열기</button>
          </div>
        </div>

        <p id="launcher-status"></p>
      </section>
    </div>
  </body>
</html>
